name: Cross-post to dev.to

# Runs on pushes that touch blog posts. Vercel doesn't report its deploys back
# to GitHub, so the script waits for each new post to be live instead
on:
  push:
    branches: [main]
    paths: ["content/blog/**"]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the dev.to articles unpublished
        type: boolean
        default: false

concurrency:
  group: crosspost-devto

jobs:
  crosspost:
    runs-on: ubuntu-latest
    # The script gives up after 10 minutes of waiting for the deploy
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Auto-caching reads packageManager and calls the runner's global
          # Yarn 1, which refuses to run for a Yarn 4 project
          package-manager-cache: false

      - name: Install dependencies
        # Yarn version comes from packageManager in package.json
        run: corepack yarn install --immutable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Cross-post new posts
        run: node scripts/crosspost-devto.mjs ${{ inputs.draft && '--draft' || '' }}
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
