<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 880" width="1250" height="880" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="title">Croton Project architecture overview</title>
<desc id="desc">The athlete talks to the bot through the Telegram API, which sends webhooks to a single Node.js process on Railway. Inside it, a Fastify server with the grammY bot hands messages to the orchestrator, confirm taps to the action executor and Strava events to background tasks; a scheduler runs the recap, planner and memory jobs. The orchestrator, background tasks and scheduler call Claude only through claude.ts, which talks to the Anthropic API. The orchestrator also uses literature search, which embeds queries with OpenAI. Background tasks fetch and rename activities on Strava, the action executor books plans in Google Calendar, and the scheduler syncs wellness from Intervals.icu. All state lives in Neon Postgres.</desc>
<style>
  .container { stroke-width: 1.5; stroke-dasharray: 6 5; }
  .cap { font-size: 12px; font-weight: 600; letter-spacing: .08em; }
  rect { stroke-width: 1.5; }
  .t { font-size: 15px; font-weight: 600; text-anchor: middle; }
  .s { font-size: 12px; text-anchor: middle; }
  .l { font-size: 11.5px; }
  .edge { fill: none; stroke-width: 1.5; }
  .dashed { stroke-dasharray: 4 4; }
  /* Dark only, in the site's colors (tailwind.config.ts) */
  .bg { fill: #171717; }
  .container { fill: #101010; stroke: #404040; }
  .cap, .s, .l { fill: #a3a3a3; }
  .t { fill: #f5f5f5; }
  .node rect { fill: #1f1f1f; stroke: #404040; }
  .ext rect { fill: #101010; stroke: #404040; }
  .core rect, .db rect { fill: #2d1b17; stroke: #ff6a4d; }
  .edge { stroke: #858585; }
  .arrowhead { fill: #858585; }
</style>
